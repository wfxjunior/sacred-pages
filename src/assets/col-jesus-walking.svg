<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Silhouette of Jesus walking away toward the dawn">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFE6D3"/>
      <stop offset="0.45" stop-color="#E8D8B8"/>
      <stop offset="0.72" stop-color="#DCBE8C"/>
      <stop offset="1" stop-color="#D2AE74"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F6E9C8" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#EBD4A0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#EBD4A0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9A76B"/>
      <stop offset="1" stop-color="#A97F49"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E3C695"/>
      <stop offset="1" stop-color="#CBA265"/>
    </linearGradient>
  </defs>

  <!-- Dawn sky -->
  <rect width="800" height="1000" fill="url(#sky)"/>

  <!-- Light the figure walks toward -->
  <circle cx="400" cy="705" r="330" fill="url(#glow)"/>
  <circle cx="400" cy="712" r="58" fill="#F8EED2" opacity="0.9"/>

  <!-- Distant hills -->
  <path d="M0 726 Q 150 700 320 718 Q 420 727 520 714 Q 660 698 800 722 L 800 760 L 0 760 Z"
        fill="#BC9256" opacity="0.55"/>

  <!-- Ground -->
  <path d="M0 752 Q 200 738 400 742 Q 600 746 800 750 L 800 1000 L 0 1000 Z" fill="url(#ground)"/>

  <!-- The road, narrowing toward the light -->
  <path d="M292 1000 C 330 900, 372 800, 396 748 L 412 748 C 448 806, 500 902, 548 1000 Z"
        fill="url(#path)" opacity="0.85"/>

  <!-- Soft mist across the horizon -->
  <rect x="0" y="732" width="800" height="26" fill="#F2E6C9" opacity="0.35"/>
  <rect x="0" y="756" width="800" height="14" fill="#F2E6C9" opacity="0.2"/>

  <!-- Distant birds -->
  <path d="M226 300 q 10 -9 20 0 M246 300 q 10 -9 20 0" stroke="#6E5847" stroke-width="3.4"
        fill="none" stroke-linecap="round" opacity="0.5"/>
  <path d="M580 254 q 8 -7 16 0 M596 254 q 8 -7 16 0" stroke="#6E5847" stroke-width="3"
        fill="none" stroke-linecap="round" opacity="0.42"/>

  <!-- The figure, seen from behind, mid-stride toward the light -->
  <g fill="#3A2C1F">
    <!-- Head and shoulder-length hair -->
    <path d="M400 396
             c -20 0 -32 14 -33 33
             c -0.6 12 2.4 22 8 29
             c -7 4 -12 10 -15 17
             l 80 0
             c -3 -7 -8 -13 -15 -17
             c 5.6 -7 8.6 -17 8 -29
             c -1 -19 -13 -33 -33 -33 z"/>
    <!-- Robe: shoulders to hem, gentle flare, sleeve folds -->
    <path d="M357 470
             c -10 6 -17 17 -20 30
             c -6 26 -10 60 -13 96
             c -3 40 -5 82 -5 118
             c 0 14 3 22 8 24
             l 146 0
             c 5 -2 8 -10 8 -24
             c 0 -36 -2 -78 -5 -118
             c -3 -36 -7 -70 -13 -96
             c -3 -13 -10 -24 -20 -30
             c -13 -6 -28 -9 -43 -9
             c -15 0 -30 3 -43 9 z"/>
    <!-- Mid-stride: the hem sways and one heel lifts behind -->
    <path d="M362 730
             c -2 16 -2 32 2 46
             c 0.8 3 3.4 5 6.6 5 l 24 0
             c 3 0 5 -2.4 4.6 -5.4
             c -1.6 -13 -2.2 -29 -1.2 -45.6 z"/>
    <path d="M404 730
             c -1 15 -0.4 30 1.8 43
             c 0.5 3 3 5 6 5 l 22 0
             c 3.2 0 5.6 -2.6 5 -5.8
             c -2.4 -13 -3.6 -27.6 -3.8 -42.2 z"/>
    <path d="M434 772 c 8 1.6 14.6 4.6 18.6 8.6 c 2 2 0.8 5.4 -2 5.4 l -18 0
             c -2.2 0 -4 -1.8 -4 -4 l 0 -7 c 0 -2 2.6 -3.4 5.4 -3 z"/>
  </g>

  <!-- The figure's long shadow, cast toward the viewer -->
  <path d="M368 792 C 380 830 356 900 322 986 C 318 994 326 1000 338 1000 L 448 1000
           C 462 1000 468 992 462 984 C 440 912 428 838 434 792 Z"
        fill="#6E5847" opacity="0.22"/>
</svg>
